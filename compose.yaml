services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL:?Set DATABASE_URL in the root environment file}}
      GAMEWEEK_SYNC_INTERVAL_MINUTES: ${GAMEWEEK_SYNC_INTERVAL_MINUTES:-5}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default
      - redis
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - redis
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  redis-data:

networks:
  redis:
    internal: true
